name: CND Municipal Ipatinga

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Forçar execução mesmo fora da janela de 15 dias'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'Testar até a pesquisa, sem emitir nova certidão'
        required: false
        type: boolean
        default: false
      test_alert:
        description: 'Testar Bark + e-mail sem acessar o portal'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '23 12 4-19 11 *' # 09:23 Brasília na janela de vencimento (04/11 a 19/11)

permissions:
  contents: write

jobs:
  cnd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEXMED_CNPJ: ${{ secrets.DEXMED_CNPJ }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      GEMINI_MODEL: gemini-3.6-flash
      BARK_KEY: ${{ secrets.BARK_KEY }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run && 'true' || 'false' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      TEST_ALERT: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert && 'true' || 'false' }}
    defaults:
      run:
        working-directory: scripts/ipatinga-cnd
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Gate determinístico
        id: gate
        if: env.TEST_ALERT != 'true'
        run: npm run gate
      - name: Instalar Chromium
        if: env.TEST_ALERT != 'true' && steps.gate.outputs.should_run == 'true'
        run: npx playwright install --with-deps chromium
      - name: Testar alertas
        if: env.TEST_ALERT == 'true'
        run: npm run test-alert
      - name: Executar CND
        if: env.TEST_ALERT != 'true' && steps.gate.outputs.should_run == 'true'
        run: npm start
      - name: Resumo
        if: always()
        run: |
          if [ -f report/run-summary.md ]; then
            cat report/run-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## CND Municipal Ipatinga" >> "$GITHUB_STEP_SUMMARY"
            echo "Relatório não foi gerado." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Salvar relatório e PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipatinga-cnd-report-${{ github.run_id }}
          path: |
            scripts/ipatinga-cnd/report/
            scripts/ipatinga-cnd/output/
          if-no-files-found: ignore
          retention-days: 30
      - name: Salvar diagnóstico de erro (prints e HTML)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ipatinga-cnd-failure-debug-${{ github.run_id }}
          path: scripts/ipatinga-cnd/debug/
          if-no-files-found: ignore
          retention-days: 30
