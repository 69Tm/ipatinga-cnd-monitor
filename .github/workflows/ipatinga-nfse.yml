name: Sincronização NFS-e DEXMED (Ipatinga)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operação fiscal a executar'
        required: true
        default: 'preflight'
        type: choice
        options:
          - preflight
          - provider_health
          - historical_analysis
          - sync
          - prepare
          - reconcile_rps
          - issue
      sync_mode:
        description: 'Modo de sincronização de notas'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
      environment:
        description: 'Ambiente fiscal (produção permitida para consulta e emissão supervisionada)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - homologation
      from_number:
        description: 'Número inicial / RPS número para reconcile_rps'
        required: false
        default: ''
        type: string
      to_number:
        description: 'Número final (opcional para filtro específico)'
        required: false
        default: ''
        type: string
      request_id:
        description: 'ID da demanda para operação prepare, issue ou reconcile_rps'
        required: false
        default: ''
        type: string
      item_index:
        description: 'Índice do item da demanda (1, 2, ...)'
        required: false
        default: '1'
        type: string
      dry_run:
        description: 'Modo simulação sem escrita no Google Sheets'
        required: false
        default: false
        type: boolean

concurrency:
  group: ipatinga-nfse-sync
  cancel-in-progress: false

jobs:
  ipatinga-nfse-job:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Instalar dependências nativas XML (xmlsec1 e libxml2-utils)
        run: sudo apt-get update && sudo apt-get install -y xmlsec1 libxml2-utils

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Instalar dependências da automação NFS-e
        working-directory: ./scripts/ipatinga-nfse
        run: npm ci

      - name: Executar bateria de testes unitários NFS-e
        working-directory: ./scripts/ipatinga-nfse
        run: node tests/test-runner.js

      - name: Executar Operação NFS-e DEXMED
        working-directory: ./scripts/ipatinga-nfse
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          NFE_SPREADSHEET_ID: ${{ vars.NFE_SPREADSHEET_ID || '1-qnJjv0YuZkrAHnfiyJuyKiU3lR3VzFl76nNQ1DCHWo' }}
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID || '16Dw9pUbpv_ViCP6a2MAgUbW1h37t3859' }}
          NFE_CERT_DRIVE_FILE_ID: ${{ vars.NFE_CERT_DRIVE_FILE_ID || '14TajJJtjSurR2tuYakbdW4dCHPHkqulb' }}
          NFE_CERT_PASSWORD: ${{ secrets.NFE_CERT_PASSWORD }}
          NFE_ISSUE_KILL_SWITCH: ${{ vars.NFE_ISSUE_KILL_SWITCH || 'false' }}
          INPUT_OPERATION: ${{ github.event.inputs.operation }}
          INPUT_SYNC_MODE: ${{ github.event.inputs.sync_mode }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          INPUT_FROM_NUMBER: ${{ github.event.inputs.from_number }}
          INPUT_TO_NUMBER: ${{ github.event.inputs.to_number }}
          INPUT_REQUEST_ID: ${{ github.event.inputs.request_id }}
          INPUT_ITEM_INDEX: ${{ github.event.inputs.item_index }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node main.js

      - name: Upload Relatório de Execução como Artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipatinga-nfse-report-${{ github.run_id }}
          path: scripts/ipatinga-nfse/report/
          retention-days: 30
