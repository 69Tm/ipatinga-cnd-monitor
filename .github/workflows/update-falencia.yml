name: Atualizar Certidão Falência TJMG DEXMED

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/falencia.pdf'
      - 'scripts/update-cnd-falencia.js'

jobs:
  update-cnd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Instalar googleapis
        run: npm install googleapis@140.0.1
      - name: Executar script de atualização
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/update-cnd-falencia.js
